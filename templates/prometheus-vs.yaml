{{- if .Values.prometheus.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "my-app-chart.fullname" . }}-vs
  namespace: {{ .Release.Namespace | quote }}
spec:
  hosts:
    - "{{ .Values.prometheus.hostPattern }}"
  gateways:
    - istio-ingressgateway
  http:
    - match:
        - uri:
            exact: "/metrics/prometheus"
      rewrite:
        uri: "/"
      route:
        - destination:
            host: {{ include "my-app-chart.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}
